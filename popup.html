<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px 16px; font: 13px system-ui, sans-serif; background: #0f0f0f; color: #f1f1f1; }
    h1 { font-size: 14px; margin: 0 0 12px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    #value { font-variant-numeric: tabular-nums; color: #aaa; }
    input[type=range] { width: 100%; accent-color: #f00; }
    button { margin-top: 10px; width: 100%; padding: 6px; border: 0; border-radius: 6px; background: #272727; color: #f1f1f1; cursor: pointer; }
    button:hover { background: #3f3f3f; }
    .toggle { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; margin-bottom: 12px; border-bottom: 1px solid #272727; font-weight: 600; cursor: pointer; }
    .toggle input { width: 16px; height: 16px; margin: 0; accent-color: #f00; cursor: pointer; }
    #settings.disabled { opacity: 0.4; pointer-events: none; }
  </style>
</head>
<body>
  <label class="toggle"><span>Classic layout</span><input id="enabled" type="checkbox"></label>
  <label class="toggle"><span>Hide Shorts in sidebar</span><input id="hideShorts" type="checkbox"></label>
  <div id="settings">
    <h1>Suggested video size</h1>
    <div class="row"><span>Thumbnail height</span><span id="value"></span></div>
    <input id="slider" type="range" min="40" max="300" step="1">
    <button id="reset">Reset to default</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
